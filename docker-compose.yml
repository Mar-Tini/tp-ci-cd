
services:
  maven:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - .:/app
      - maven_repo:/root/.m2
    command: mvn clean compile exec:java
    
  test:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - .:/app
      - maven_repo:/root/.m2
    command: mvn test

  
  ngrok:
    image: ngrok/ngrok:latest
    command:
      - "http"
      - "host.docker.internal:8080"
    environment:
      NGROK_AUTHTOKEN:  ${NGROK_AUTHTOKEN}
    ports:
      - "4041:4040"

  app:

    build: .

    container_name: spring-app

    ports:
      - "8081:8080"

volumes:
  maven_repo: 
