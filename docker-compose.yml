
services:
  maven:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - .:/app
      - maven_repo:/root/.m2
    command: mvn clean compile exec:java
    
  test:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - .:/app
      - maven_repo:/root/.m2
    command: mvn test

volumes:
  maven_repo: 
  jenkins_home: